services:
  talk-to-learn:
    container_name: talk-to-learn
    image: talk-to-learn:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8083}:8083"
    env_file:
      - .env
    environment:
      PORT: 8083
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/dev.db}
    volumes:
      - talk_to_learn_data:/app/data

volumes:
  talk_to_learn_data:
