openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Talk-to-Learn API
  version: 1.0.0
  description: >-
    OpenAPI-Dokumentation der Server-Endpunkte unter `app/api/*`.
    Die Spezifikation beschreibt die aktuell implementierten Request-/Response-Formate.
servers:
  - url: /
    description: Relative Basis-URL der Next.js App
security:
  - NextAuthSession: []
  - NextAuthSecureSession: []
tags:
  - name: Progress
  - name: Decks
  - name: Questions
  - name: Files
  - name: Account
  - name: AI
  - name: Evaluation
  - name: Analytics
  - name: Billing
  - name: Stripe
  - name: Public
  - name: Auth
paths:
  /api/progress:
    get:
      tags: [Progress]
      summary: Lernfortschritt für ein Lernset laden
      operationId: getProgress
      parameters:
        - $ref: '#/components/parameters/DeckIdQuery'
      responses:
        '200':
          description: Fortschritt geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Progress]
      summary: Lernfortschritt für ein Lernset aktualisieren
      operationId: updateProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressPostRequest'
      responses:
        '200':
          description: Fortschritt aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/questions:
    get:
      tags: [Questions]
      summary: Fragen eines Lernsets laden
      operationId: getQuestions
      parameters:
        - $ref: '#/components/parameters/DeckIdQuery'
      responses:
        '200':
          description: Fragen geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/files:
    get:
      tags: [Files]
      summary: Lernsets auflisten
      operationId: listFiles
      description: Gibt bei fehlender Anmeldung ein leeres Array zurück.
      security: []
      responses:
        '200':
          description: Lernsets geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/decks/{id}:
    parameters:
      - $ref: '#/components/parameters/DeckIdPath'
    get:
      tags: [Decks]
      summary: Lernset mit Karten laden
      operationId: getDeckById
      responses:
        '200':
          description: Lernset geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Decks]
      summary: Lernset oder Lernphase aktualisieren
      operationId: updateDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckUpdateRequest'
      responses:
        '200':
          description: Aktualisierung erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Decks]
      summary: Lernset löschen
      operationId: deleteDeck
      responses:
        '200':
          description: Lernset gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/analytics/event:
    post:
      tags: [Analytics]
      summary: Analytics-Event protokollieren
      operationId: logAnalyticsEvent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventRequest'
      responses:
        '200':
          description: Event akzeptiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/ai/save:
    post:
      tags: [AI]
      summary: KI-generiertes Lernset speichern
      operationId: saveAiDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSaveRequest'
      responses:
        '200':
          description: Lernset gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSaveResponse'
        '400':
          description: Ungültige Anfrage oder planabhängiges Fragenlimit überschritten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/ai/generate:
    post:
      tags: [AI]
      summary: Karten aus Text generieren (Legacy JSON Endpoint)
      operationId: generateCards
      security: []
      description: >-
        Generiert Karten direkt aus Text.
        `count` wird serverseitig abhängig vom Nutzerplan begrenzt
        (ohne Authentifizierung mit konservativem Free-Limit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGenerateRequest'
      responses:
        '200':
          description: Karten generiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/StructuredApiError500'
        '502':
          description: KI-Antwort unvollständig oder ungültig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredApiErrorResponse'
        '504':
          $ref: '#/components/responses/StructuredApiError504'

  /api/ai/extract:
    post:
      tags: [AI]
      summary: Text aus hochgeladener Datei extrahieren
      operationId: extractText
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Text extrahiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractTextResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/ai/derive-file:
    post:
      tags: [AI]
      summary: Generierungsparameter aus Datei ableiten
      operationId: deriveFileParams
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Parameter abgeleitet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DerivedGenerationParams'
        '400':
          $ref: '#/components/responses/StructuredApiError400'
        '413':
          $ref: '#/components/responses/StructuredApiError413'
        '422':
          $ref: '#/components/responses/StructuredApiError422'
        '500':
          $ref: '#/components/responses/StructuredApiError500'
        '504':
          $ref: '#/components/responses/StructuredApiError504'

  /api/ai/generate-file:
    post:
      tags: [AI]
      summary: Karten aus Datei generieren
      operationId: generateCardsFromFile
      security: []
      description: >-
        `count` wird serverseitig abhängig vom Nutzerplan begrenzt
        (ohne Authentifizierung mit konservativem Free-Limit).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [default, alternate]
                  description: Optional; nur `alternate` wird explizit ausgewertet.
                title:
                  type: string
                topicFocus:
                  type: string
                style:
                  type: string
                  enum: [erklärend, pruefungsnah, kompakt]
                difficulty:
                  type: string
                  enum: [leicht, mittel, anspruchsvoll]
                count:
                  type: string
                  description: Gewünschte Kartenanzahl; serverseitig planabhängig begrenzt.
      responses:
        '200':
          description: Karten generiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeckFromFileResponse'
        '400':
          $ref: '#/components/responses/StructuredApiError400'
        '413':
          $ref: '#/components/responses/StructuredApiError413'
        '422':
          $ref: '#/components/responses/StructuredApiError422'
        '500':
          $ref: '#/components/responses/StructuredApiError500'
        '504':
          $ref: '#/components/responses/StructuredApiError504'

  /api/ai/regenerate:
    post:
      tags: [AI]
      summary: Karten im Alternativmodus aus Datei neu generieren
      operationId: regenerateCardsFromFile
      security: []
      description: >-
        `count` wird serverseitig abhängig vom Nutzerplan begrenzt
        (ohne Authentifizierung mit konservativem Free-Limit).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                topicFocus:
                  type: string
                style:
                  type: string
                  enum: [erklärend, pruefungsnah, kompakt]
                difficulty:
                  type: string
                  enum: [leicht, mittel, anspruchsvoll]
                count:
                  type: string
                  description: Gewünschte Kartenanzahl; serverseitig planabhängig begrenzt.
      responses:
        '200':
          description: Karten neu generiert
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreateDeckFromFileResponse'
                  - type: object
                    properties:
                      mode:
                        type: string
                        enum: [alternate]
        '400':
          $ref: '#/components/responses/StructuredApiError400'
        '413':
          $ref: '#/components/responses/StructuredApiError413'
        '422':
          $ref: '#/components/responses/StructuredApiError422'
        '500':
          $ref: '#/components/responses/StructuredApiError500'
        '504':
          $ref: '#/components/responses/StructuredApiError504'

  /api/ai/refine-card:
    post:
      tags: [AI]
      summary: Einzelne Karte verfeinern
      operationId: refineCard
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefineCardRequest'
      responses:
        '200':
          description: Karte verfeinert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefineCardResponse'
        '400':
          $ref: '#/components/responses/StructuredApiError400'
        '500':
          $ref: '#/components/responses/StructuredApiError500'
        '502':
          description: KI-Antwort unvollständig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredApiErrorResponse'

  /api/evaluate:
    post:
      tags: [Evaluation]
      summary: Gesprochene Antwort transkribieren und bewerten
      operationId: evaluateAnswer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, questionId, deckId]
              properties:
                file:
                  type: string
                  format: binary
                questionId:
                  type: string
                deckId:
                  type: string
                evaluationMode:
                  type: string
                  enum: [graded, supportive]
                speechSeconds:
                  type: string
                tzOffsetMinutes:
                  type: string
      responses:
        '200':
          description: Bewertung erzeugt
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EvaluateGradedResponse'
                  - $ref: '#/components/schemas/EvaluateSupportiveResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/public/stats:
    get:
      tags: [Public]
      summary: Öffentliche Kennzahlen abrufen
      operationId: getPublicStats
      security: []
      responses:
        '200':
          description: Kennzahlen geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatsResponse'

  /api/account:
    delete:
      tags: [Account]
      summary: Eigenen Account löschen
      operationId: deleteAccount
      responses:
        '200':
          description: Account gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/account/profile:
    put:
      tags: [Account]
      summary: Anzeigenamen aktualisieren
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfileUpdateRequest'
      responses:
        '200':
          description: Profil aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/account/dashboard:
    get:
      tags: [Account]
      summary: Account-Dashboard-Daten laden
      operationId: getAccountDashboard
      parameters:
        - in: query
          name: tzOffsetMinutes
          required: false
          schema:
            type: string
          description: Zeitzonenoffset in Minuten zur Berechnung der Tagesnutzung.
      responses:
        '200':
          description: Dashboard geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDashboardResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/account/danger:
    post:
      tags: [Account]
      summary: Gefährliche Massenaktionen ausführen
      operationId: runDangerAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DangerActionRequest'
      responses:
        '200':
          description: Aktion ausgeführt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DangerActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/billing/create-checkout-session:
    post:
      tags: [Billing]
      summary: Stripe Checkout Session erstellen
      operationId: createCheckoutSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
      responses:
        '200':
          description: Checkout Session erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/billing/checkout-status:
    get:
      tags: [Billing]
      summary: Stripe Checkout Session verifizieren und Abo synchronisieren
      operationId: getCheckoutStatus
      parameters:
        - in: query
          name: session_id
          required: true
          schema:
            type: string
          description: Stripe Checkout Session ID (`cs_...`).
      responses:
        '200':
          description: Checkout-Status geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Session gehört nicht zum authentifizierten User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/stripe/portal-session:
    post:
      tags: [Stripe]
      summary: Stripe Billing Portal Session erstellen
      operationId: createPortalSession
      responses:
        '200':
          description: Portal Session erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripePortalSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/stripe/subscription:
    post:
      tags: [Stripe]
      summary: Stripe Abo kündigen oder reaktivieren
      operationId: updateSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeSubscriptionActionRequest'
      responses:
        '200':
          description: Abo-Status aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeSubscriptionSnapshot'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Billing-Schema nicht migriert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/stripe/webhook:
    post:
      tags: [Stripe]
      summary: Stripe Webhook Event verarbeiten
      operationId: stripeWebhook
      security: []
      parameters:
        - $ref: '#/components/parameters/StripeSignatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event akzeptiert
        '400':
          description: Ungültige Konfiguration oder Signatur
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Fehler bei der Webhook-Verarbeitung
          content:
            text/plain:
              schema:
                type: string

  /api/auth/{nextauthPath}:
    parameters:
      - in: path
        name: nextauthPath
        required: true
        schema:
          type: string
        description: NextAuth Catch-all Segment (z. B. `session`, `signin`, `callback/google`).
    get:
      tags: [Auth]
      summary: NextAuth Catch-all (GET)
      operationId: nextAuthGet
      security: []
      responses:
        '200':
          description: Erfolgreiche Antwort des NextAuth Handlers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Auth]
      summary: NextAuth Catch-all (POST)
      operationId: nextAuthPost
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Erfolgreiche Antwort des NextAuth Handlers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    NextAuthSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
    NextAuthSecureSession:
      type: apiKey
      in: cookie
      name: __Secure-next-auth.session-token

  parameters:
    DeckIdQuery:
      in: query
      name: deckId
      required: true
      schema:
        type: string
      description: ID des Lernsets.
    DeckIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ID des Lernsets.
    StripeSignatureHeader:
      in: header
      name: stripe-signature
      required: true
      schema:
        type: string
      description: Stripe Webhook Signaturheader.

  responses:
    BadRequestError:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Nicht authentifiziert
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Interner Serverfehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StructuredApiError400:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredApiErrorResponse'
    StructuredApiError413:
      description: Datei zu groß
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredApiErrorResponse'
    StructuredApiError422:
      description: Dateiinhalt konnte nicht verarbeitet werden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredApiErrorResponse'
    StructuredApiError500:
      description: KI-Verarbeitung fehlgeschlagen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredApiErrorResponse'
    StructuredApiError504:
      description: KI-Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredApiErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    StructuredApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                - FILE_TOO_LARGE
                - UNSUPPORTED_FILE_TYPE
                - PARSING_ERROR
                - EMPTY_DOCUMENT
                - AI_TIMEOUT
                - AI_RESPONSE_INVALID
                - AI_GENERATION_FAILED
                - INVALID_REQUEST
            message:
              type: string
            retryable:
              type: boolean

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    LearningStage:
      type: string
      enum: [intro, scaffolded, free]

